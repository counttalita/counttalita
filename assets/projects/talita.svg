.glow{animation:g 4s ease-in-out infinite}@keyframes g{50%{opacity:.35}}
</style>
<defs><radialGradient id="h" cx="1" cy="0" r="1"><stop offset="0" stop-color="#39d353" stop-opacity=".18"/><stop offset=".6" stop-color="#39d353" stop-opacity="0"/></radialGradient></defs>
<g class="in">
<rect x=".5" y=".5" width="579" height="209" rx="16" fill="#161b22" stroke="#30363d"/>
<rect x=".5" y=".5" width="579" height="209" rx="16" fill="url(#h)" class="glow"/>
<text x="28" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e6edf3" letter-spacing="-.5">T.A.L.I.T.A.</text>
<rect x="450" y="34" width="102" height="24" rx="12" fill="none" stroke="#30363d"/>
